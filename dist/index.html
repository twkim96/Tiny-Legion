<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#173e68" />
    <meta name="description" content="Tiny Legion" />
    <title>Tiny Legion</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./style.css?v=shared-ui-3" />
    <link rel="stylesheet" href="./mobile-theme.css?v=mobile-ui-2" />
  </head>
  <body>
    <main class="game" id="game" aria-label="Tiny Legion">
      <section class="battlefield" aria-label="전장">
        <canvas
          id="battle-canvas"
          aria-label="아군과 적이 맞서는 가로 전장"
        ></canvas>
        <div class="battle-ready" id="battle-ready" hidden>
          <span id="ready-stage">1-1</span>
          <h1 id="ready-title">초원</h1>
          <button class="primary-button" id="start-battle">
            <span data-icon="play"></span>시작
          </button>
        </div>
        <div class="battle-result" id="battle-result" hidden></div>
      </section>
      <div class="account-hud">
        <button
          class="profile-button"
          id="profile-button"
          aria-label="동료"
          data-tip="동료"
        >
          <span id="brand-icon"></span>
        </button>
        <div class="resources">
          <div class="resource" aria-label="도토리" data-tip="도토리 · 동료를 성장시키는 데 사용합니다.">
            <span data-icon="acorn"></span><strong id="gold">0</strong>
          </div>
          <div
            class="resource gem-resource"
            data-tip="새로운 동료를 만날 수 있습니다."
          >
            <span data-icon="gem"></span><strong id="diamonds">0</strong>
          </div>
        </div>
      </div>
      <div
        class="combat-power"
        data-tip="보유 동료의 공유 레벨·특별강화·전투 보석을 반영합니다. 변경한 성장은 다음 전투에 적용됩니다."
        aria-label="전투력"
      >
        <span data-icon="swords"></span><strong id="combat-power">0</strong>
      </div>
      <button class="guide-mission" id="guide-mission" hidden aria-label="미션">
        <strong id="mission-heading">미션</strong>
        <span id="mission-title"></span>
        <span id="mission-progress"></span>
        <span class="mission-rewards" id="mission-rewards"></span>
      </button>
      <div class="stage-hud">
        <button
          class="stage-button"
          id="stage-select"
          aria-label="스테이지 선택"
        >
          <span data-icon="map"></span><strong id="stage-number">1-1</strong
          ><span id="stage-name">초원</span><span class="chevron" id="stage-chevron">⌄</span>
        </button>
        <div class="stage-status">
          <span class="wave-progress" id="wave-progress" aria-label="웨이브"
            >1 / 3</span
          >
          <button
            class="mode-indicator"
            id="mode-select"
            aria-label="현재 전투 모드"
          >
            <span id="current-mode-icon" data-icon="leaf"></span
            ><span id="current-mode">방치</span>
          </button>
          <div class="battle-clock">
            <span data-icon="clock"></span><span id="battle-time">01:30</span
            >
          </div>
        </div>
      </div>
      <nav class="game-menus" id="game-menus" aria-label="게임 메뉴"></nav>
      <div
        class="castle-health player-health"
        id="player-castle-health"
        aria-label="아군 성 체력"
      >
        <div class="health-track"><div id="player-health"></div></div>
        <span id="player-health-text">1,000 / 1,000</span>
      </div>
      <div
        class="castle-health enemy-health"
        id="enemy-castle-health"
        aria-label="적 성 체력"
      >
        <div class="health-track"><div id="enemy-health"></div></div>
        <span id="enemy-health-text">2,000 / 2,000</span>
      </div>
      <button
        class="income-button"
        id="income"
        aria-label="방치 수익"
        data-tip="기록한 성적에 따라 도토리와 다이아가 쌓입니다."
      >
        <span data-icon="acorn"></span>
      </button>
      <div class="field-note" id="field-note">
        <span id="field-note-text">자동 소환 중</span>
      </div>
      <button class="challenge-start" id="challenge-start" aria-label="도전 전투 시작">
        <span data-icon="swords"></span><strong>전투 시작</strong>
      </button>
      <section class="idle-result-popup" id="idle-result-popup" role="dialog" aria-modal="false" aria-labelledby="idle-result-title" hidden>
        <header><h2 id="idle-result-title"></h2><button class="icon-button" id="close-idle-result" aria-label="방치 결과 닫기"><span data-icon="close"></span></button></header>
        <div id="idle-result-content"></div>
        <label class="idle-result-dismiss"><input type="checkbox" id="hide-idle-result">이 스테이지에서 다시 보지 않기</label>
        <button class="primary-button" id="confirm-idle-result">확인</button>
      </section>
      <section class="summon-bar" aria-label="동료 소환">
        <div
          class="battle-wallet"
          role="group"
          aria-label="전투 골드"
          data-tip="시간에 따라 쌓이는 전투용 골드입니다. 강화에 쓰는 도토리와 별개입니다."
        >
          <span data-icon="coin"></span><strong id="battle-gold">220</strong>
          <div class="wallet-track"><div id="wallet-fill"></div></div>
        </div>
        <div class="unit-hand" id="unit-hand"></div>
        <button
          class="skill-button"
          id="skill"
          aria-label="대포"
          data-tip="대포 · 적을 밀어내고 피해를 줍니다."
        >
          <span data-icon="cannon"></span
          ><span class="skill-cooldown" id="skill-cooldown"></span>
        </button>
      </section>
    </main>
    <div class="rotate-hint" id="rotate-hint">
      <div class="rotate-art"><span data-icon="rotate"></span></div>
      <strong>가로로 돌려주세요</strong><span>Tiny Legion</span>
      <button class="primary-button" id="rotate-fullscreen">전체 화면</button>
      <p id="rotate-status" role="status" aria-live="polite"></p>
    </div>
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section
        class="modal"
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <header class="modal-header">
          <button class="icon-button" id="back-modal" aria-label="뒤로가기" hidden><span data-icon="back"></span></button>
          <h2 id="modal-title"></h2>
          <button class="icon-button" id="close-modal" aria-label="닫기">
            <span data-icon="close"></span>
          </button>
        </header>
        <div class="modal-content" id="modal-content"></div>
      </section>
    </div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
