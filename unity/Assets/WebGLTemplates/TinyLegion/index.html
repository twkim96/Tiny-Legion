<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tiny Legion</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#d8dfca}body{display:flex;align-items:center;justify-content:center}#unity-container{position:relative;width:min(1600px,calc((100dvh - 32px)*16/9),calc(100vw - 32px));aspect-ratio:16/9;overflow:hidden;border:2px solid #738368;border-radius:16px;box-shadow:0 16px 60px #25322130}canvas{width:100%;height:100%;display:block}#loading{position:absolute;inset:0;display:grid;place-content:center;font:18px sans-serif;color:#334431;background:#faf8ef}@media(max-height:560px) and (orientation:landscape),(max-width:1000px) and (orientation:landscape){#unity-container{width:100vw;height:100dvh;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}}:fullscreen #unity-container{width:100vw;height:100dvh;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}</style></head><body><div id="unity-container"><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading">Tiny Legion 불러오는 중…</div></div><script src="Build/{{{ LOADER_FILENAME }}}"></script><script>createUnityInstance(document.querySelector('#unity-canvas'),{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Tiny Legion',productName:'Tiny Legion',productVersion:'0.1.0'},function(progress){document.querySelector('#loading').textContent='Tiny Legion '+Math.round(progress*100)+'%';}).then(function(instance){window.unityInstance=instance;document.querySelector('#loading').remove();}).catch(function(error){document.querySelector('#loading').textContent='불러오지 못했습니다: '+error;});</script></body></html>
